name: Dependabot auto-merge
on:
  workflow_run:
    workflows: ["Cloudflare Workers build"]
    types: [completed]
permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write
jobs:
  merge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve PR and verify Dependabot
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          PR=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.pull_requests[0].number // empty')
          [ -z "$PR" ] && { echo "No pull request for this run"; exit 0; }
          AUTHOR=$(gh pr view "$PR" --repo "$REPO" --json author --jq '.author.login')
          if [ "$AUTHOR" != "dependabot[bot]" ] && [ "$AUTHOR" != "app/dependabot" ]; then
            echo "Not a Dependabot PR"
            exit 0
          fi
          TITLE=$(gh pr view "$PR" --repo "$REPO" --json title --jq '.title')
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
      - name: Skip major updates
        if: contains(steps.pr.outputs.title, 'major-deps')
        run: echo "Major update left for manual review"
      - name: Wait for checks and merge
        if: >
          !contains(steps.pr.outputs.title, 'major-deps') &&
          (contains(steps.pr.outputs.title, 'minor-patch-deps') ||
           contains(steps.pr.outputs.title, 'security-updates') ||
           contains(steps.pr.outputs.title, 'github-actions'))
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          gh pr checks "$PR" --repo "$REPO" --watch --interval 30
          gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
