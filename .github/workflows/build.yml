name: Cloudflare Workers build
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    name: Cloudflare Workers build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx wrangler deploy --dry-run
